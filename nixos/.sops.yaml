# Who can decrypt what. Machines decrypt with their SSH host key (converted
# to age); the admin key (~/.config/sops/age/keys.txt) is for editing.
# After changing recipients: sops updatekeys secrets/<file>.yaml
keys:
  - &admin age10rmlqm2x94w6vlq603ea0krxc0vt43aj8watsvtv3t9u8euktpdq2ll8xc
  - &vm age1edg2ykccnp475wm6ntd507r3a5hz9j2gt283l0cnwdsnfsdg25fqf38khx
creation_rules:
  - path_regex: secrets/vm\.yaml$
    key_groups:
      - age: [*admin, *vm]
