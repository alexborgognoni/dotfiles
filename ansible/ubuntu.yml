# Ubuntu: only what Nix cannot provide on a non-NixOS system (root daemons
# tied to the distribution, the login shell binary). Everything else is Nix:
#   user level -> Home Manager (nix/homes/<machine>.nix)
#   root level -> system-manager (nix/systems/<machine>.nix)
#
# Run as root by ./install:  sudo ansible-playbook ansible/ubuntu.yml
# Corporate and OS packages are never touched.
- name: Ubuntu packages and settings outside Nix
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    user: "{{ lookup('env', 'SUDO_USER') }}"
    release: "{{ ansible_facts.distribution_release }}"
    # Third-party apt repositories. File names and keyrings match the
    # existing laptop setup: apt rejects a repository listed twice with
    # different keyrings. (Tools, databases and CUDA come from Nix: globally
    # or per project in dev shells.)
    apt_repos:
      - name: docker
        key: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.asc
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ release }} stable"
    apt_packages:
      # Login shell (its configuration comes from Home Manager)
      - zsh
      # Container engine (root daemon)
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      # VM host: libvirt daemon with Ubuntu's QEMU/OVMF (AppArmor profiles
      # expect these); virt-manager, virt-install etc. come from Nix
      - libvirt-daemon-system
      - qemu-system-x86
      - ovmf
      # Zscaler's tray links against the system Qt 6 (WebEngine included) but
      # is not an apt package, so autoremove does not see the dependency
      - libqt6core6
      - libqt6gui6
      - libqt6widgets6
      - libqt6network6
      - libqt6sql6
      - libqt6sql6-sqlite
      - libqt6dbus6
      - libqt6webenginecore6
      - libqt6webenginecore6-bin
      - libqt6webenginewidgets6
      - libqt6webengine6-data
      - libqt6opengl6
      - libqt6positioning6
      - libqt6printsupport6
      - libqt6webchannel6
      - qt6-qpa-plugins
    # Corporate browser (Intune/Entra sign-in); maintains its own apt
    # repository after installing
    vendor_debs:
      microsoft-edge-stable: https://go.microsoft.com/fwlink?linkid=2149051&brand=M102

  tasks:
    - name: Repository keys (downloaded)
      ansible.builtin.get_url:
        url: "{{ item.key }}"
        dest: "/etc/apt/keyrings/{{ item.name }}.key.asc"
        mode: "0644"
      loop: "{{ apt_repos }}"

    - name: Repository keyrings (binary keyrings dearmored, .asc used as is)
      ansible.builtin.shell: |
        case "{{ item.keyring }}" in
          *.asc) cp "/etc/apt/keyrings/{{ item.name }}.key.asc" "{{ item.keyring }}" ;;
          *) gpg --dearmor --yes -o "{{ item.keyring }}" "/etc/apt/keyrings/{{ item.name }}.key.asc" ;;
        esac
        chmod 644 "{{ item.keyring }}"
      args:
        creates: "{{ item.keyring }}"
      loop: "{{ apt_repos }}"

    - name: Repositories
      ansible.builtin.apt_repository:
        repo: "{{ item.repo }}"
        filename: "{{ item.name }}"
        update_cache: false
      loop: "{{ apt_repos }}"

    - name: apt packages
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        update_cache: true

    - name: Installed packages
      ansible.builtin.package_facts:

    - name: Vendor packages (Edge)
      ansible.builtin.apt:
        deb: "{{ item.value }}"
      loop: "{{ vendor_debs | dict2items }}"
      when: item.key not in ansible_facts.packages

    - name: "{{ user }}: docker and libvirt groups, zsh as login shell"
      ansible.builtin.user:
        name: "{{ user }}"
        groups: [docker, libvirt]
        append: true
        shell: /usr/bin/zsh
