# vim:ft=kitty

#####################################
# Colors
#####################################

## Theme:    Catppuccin Kitty Macchiato
## Author:   Catppuccin Org
## License:  MIT
## Source:   https://github.com/catppuccin/kitty/blob/main/themes/macchiato.conf
## Description: Soothing pastel theme for the high-spirited!

# Core colors
foreground              #CAD3F5
background              #24273A
selection_foreground    #24273A
selection_background    #F4DBD6

# Cursor
cursor                  #F4DBD6
cursor_text_color       #24273A

# URL settings
url_color               #F4DBD6
url_style               curly
detect_urls             yes
open_url_with           default
underline_hyperlinks    always

# Window border
active_border_color     #B7BDF8
inactive_border_color   #6E738D
bell_border_color       #EED49F

# Titlebar (Wayland & macOS)
wayland_titlebar_color  #24273A
macos_titlebar_color    #24273A

# Tab bar
active_tab_foreground     #181926
active_tab_background     #C6A0F6
inactive_tab_foreground   #CAD3F5
inactive_tab_background   #1E2030
tab_bar_background        #181926

# Marks (highlighted text)
mark1_foreground          #24273A
mark1_background          #B7BDF8
mark2_foreground          #24273A
mark2_background          #C6A0F6
mark3_foreground          #24273A
mark3_background          #7DC4E4

#####################################
# Terminal Colors (16-color palette)
#####################################

# Black
color0   #494D64
color8   #5B6078

# Red
color1   #ED8796
color9   #ED8796

# Green
color2   #A6DA95
color10  #A6DA95

# Yellow
color3   #EED49F
color11  #EED49F

# Blue
color4   #8AADF4
color12  #8AADF4

# Magenta
color5   #F5BDE6
color13  #F5BDE6

# Cyan
color6   #8BD5CA
color14  #8BD5CA

# White
color7   #B8C0E0
color15  #A5ADCB

#####################################
# Font
#####################################

font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          12.0

# Route Nerd Font PUA ranges to the dedicated symbols font. Kitty recommends
# this over patched fonts (which are lossy). Requires "Symbols Nerd Font Mono"
# installed (NerdFontsSymbolsOnly release from ryanoasis/nerd-fonts).
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

#####################################
# Behavior & Performance
#####################################

# Clipboard
map ctrl+shift+v paste_from_clipboard

# Mouse actions for URLs (hold Shift to click links inside tmux)
mouse_map shift+left click ungrabbed mouse_handle_click selection link prompt
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt

# Input lag tuning
input_delay         3

# Startup session
startup_session     startup.conf

# Window behavior
confirm_os_window_close  0
hide_window_decorations  no

# Cursor trail effect
cursor_trail        3
cursor_trail_decay  0.2 0.3

# Scrolling
wheel_scroll_multiplier  1
